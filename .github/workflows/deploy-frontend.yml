name: Deploy Frontend

on:
  push:
    branches: [ master ]
    paths:
      - 'src/blazorapp/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore src/blazorapp/IndaloaventurApp.sln

      - name: Publish
        run: dotnet publish src/blazorapp/IndaloaventurApp.Web/IndaloaventurApp.Web/IndaloaventurApp.Web.csproj -c Release -o ./publish-frontend

      # --------------------------------------------------------
      # 1. Crear app_offline.htm
      # --------------------------------------------------------
      - name: Create app_offline.htm
        shell: pwsh
        run: |
          @"
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8" />
              <title>Mantenimiento</title>
          </head>
          <body>
              <h1>Aplicación en mantenimiento</h1>
              <p>Estamos actualizando la aplicación. Inténtalo de nuevo en unos minutos.</p>
          </body>
          </html>
          "@ | Out-File -FilePath "./publish-frontend/app_offline.htm" -Encoding utf8

      # --------------------------------------------------------
      # 2. Subir SOLO app_offline.htm
      #    Esto hace que IIS detenga la aplicación
      # --------------------------------------------------------
      - name: Put application offline
        shell: pwsh
        run: |
          curl.exe `
            --ftp-create-dirs `
            --user "${{ secrets.FTP_USERNAME_APP }}:${{ secrets.FTP_PASSWORD_APP }}" `
            -T "./publish-frontend/app_offline.htm" `
            "ftp://${{ secrets.FTP_SERVER_APP }}/app_offline.htm"

      # --------------------------------------------------------
      # 3. Dar tiempo a IIS para descargar la aplicación
      # --------------------------------------------------------
      - name: Wait for application shutdown
        shell: pwsh
        run: Start-Sleep -Seconds 10

      # --------------------------------------------------------
      # 4. Desplegar aplicación
      #
      # app_offline.htm sigue dentro del publish,
      # por lo que permanece activo durante todo el deploy.
      # --------------------------------------------------------
      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER_APP }}
          username: ${{ secrets.FTP_USERNAME_APP }}
          password: ${{ secrets.FTP_PASSWORD_APP }}
          local-dir: ./publish-frontend/

      # --------------------------------------------------------
      # 5. Eliminar app_offline.htm
      #    IIS volverá a arrancar la aplicación
      # --------------------------------------------------------
      - name: Bring application online
        shell: pwsh
        run: |
          curl.exe `
            --user "${{ secrets.FTP_USERNAME_APP }}:${{ secrets.FTP_PASSWORD_APP }}" `
            --quote "DELE app_offline.htm" `
            "ftp://${{ secrets.FTP_SERVER_APP }}/"
