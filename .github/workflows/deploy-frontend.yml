name: Deploy Frontend

on:
  push:
    branches: [ master ]
    paths:
      - 'src/blazorapp/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore src/blazorapp/IndaloaventurApp.sln

      - name: Publish
        run: dotnet publish src/blazorapp/IndaloaventurApp.Web/IndaloaventurApp.Web/IndaloaventurApp.Web.csproj -c Release -o ./publish-frontend

      - name: Create app_offline.htm
        shell: pwsh
        run: |
          @"
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8" />
              <title>Mantenimiento</title>
          </head>
          <body>
              <h1>Aplicación en mantenimiento</h1>
              <p>Estamos actualizando la aplicación. Inténtalo de nuevo en unos minutos.</p>
          </body>
          </html>
          "@ | Out-File -FilePath "./publish-frontend/app_offline.htm" -Encoding utf8

      - name: Put application offline
        id: put_offline
        shell: pwsh
        env:
          FTP_SERVER_APP: ${{ secrets.FTP_SERVER_APP }}
          FTP_USERNAME_APP: ${{ secrets.FTP_USERNAME_APP }}
          FTP_PASSWORD_APP: ${{ secrets.FTP_PASSWORD_APP }}
        run: |
          curl.exe `
            --fail `
            --show-error `
            --ftp-create-dirs `
            --user "$($env:FTP_USERNAME_APP):$($env:FTP_PASSWORD_APP)" `
            -T "./publish-frontend/app_offline.htm" `
            "ftp://$($env:FTP_SERVER_APP)/app_offline.htm"

      - name: Wait for application shutdown
        shell: pwsh
        run: Start-Sleep -Seconds 10

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER_APP }}
          username: ${{ secrets.FTP_USERNAME_APP }}
          password: ${{ secrets.FTP_PASSWORD_APP }}
          local-dir: ./publish-frontend/

      - name: Bring application online
        if: always() && steps.put_offline.outcome == 'success'
        shell: pwsh
        env:
          FTP_SERVER_APP: ${{ secrets.FTP_SERVER_APP }}
          FTP_USERNAME_APP: ${{ secrets.FTP_USERNAME_APP }}
          FTP_PASSWORD_APP: ${{ secrets.FTP_PASSWORD_APP }}
        run: |
          curl.exe `
            --fail `
            --show-error `
            --user "$($env:FTP_USERNAME_APP):$($env:FTP_PASSWORD_APP)" `
            --quote "DELE app_offline.htm" `
            "ftp://$($env:FTP_SERVER_APP)/"
